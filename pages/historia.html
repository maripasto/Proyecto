<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Más sobre su vida - Faustino Míguez</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Georgia, 'Times New Roman', serif;
            background: linear-gradient(135deg, #f5efe1, #e8dcc5);
            color: #6d4726;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .contenedor {
            background-color: #fffaf0;
            width: 90%;
            max-width: 800px;
            padding: 50px;
            text-align: center;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            border: 2px solid #8c3044;
        }

        h1 {
            font-size: 36px;
            color:#8c3044;
            margin-bottom: 25px;
        }

        p {
            font-size: 20px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        a {
            display: inline-block;
            background-color:#8c3044;
            color: white;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            transition: 0.3s;
        }

        a:hover {
            background-color: #8c3044;
            transform: scale(1.05);
        }

        @media (max-width: 600px) {
            .contenedor {
                padding: 30px 20px;
            }

            h1 {
                font-size: 27px;
            }

            p {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <header>
            <h1>
                ¿Querés conocer más sobre la vida de San Faustino Míguez de la Encarnación?
            </h1>
        </header>

        <p>
            Para conocer más sobre la vida de San Faustino Míguez de la Encarnación,
            hacé clic en el siguiente botón:
        </p>

        <a href="https://drive.google.com/drive/folders/1K6Qcig0GlIy3pXgiOzBRVKRy5W_yjsMj">
            Conocer más
        </a>

    </div>

</body>
</html>
